---
layout: default
---
<div class="wrap">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {%- if page.lede %}
    <p class="lede">{{ page.lede }}</p>
    {%- endif %}
  </header>
</div>

{%- if page.linkbar %}
<div class="linkbar">
  <div class="wrap">{% include links.html variant="bar" %}</div>
</div>
{%- endif %}

{%- if page.sticky_sections %}<div class="sticky-sections">{% endif %}
{{ content }}
{%- if page.sticky_sections %}</div>{% endif %}
