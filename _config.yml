title: Luca Scimeca
tagline: AI Research Scientist & Founder
description: >-
  Luca Scimeca — AI research scientist and founder working at the intersection
  of AI and scientific discovery.
url: "https://lucascimeca.github.io"
baseurl: ""
lang: en

author:
  name: Luca Scimeca
  email: luca.scimeca@live.com

# The CV lives in Google Drive so it updates here whenever the file is replaced
# there. Keep the SAME file (Drive: "Manage versions" -> upload new version) —
# deleting and re-uploading mints a new id and this would need updating.
cv:
  drive_id: 1LKWK9GO0gtka5NWx0piEDe9Jt5y3C2sm

# ---------------------------------------------------------------------------
# Work-in-progress switch.
#   noindex: true   -> robots.txt disallows everything + <meta name="robots" content="noindex">
#   Flip to false when you're ready for the site to be discoverable.
# ---------------------------------------------------------------------------
noindex: true

# Cloudflare Web Analytics. Paste the beacon token from the Cloudflare
# dashboard (Web Analytics -> Add a site) to switch it on; leave it blank and
# no script is loaded at all. Cookieless, and it works whether or not the
# domain uses Cloudflare for DNS.
cloudflare_analytics_token: "582de04027774a398861216a8c1d4a55"

# Show or hide the whole Posts section (nav link, home "Writing" block, /posts/).
# Individual posts can also be hidden with `visible: false` in their front matter.
show_posts: true

permalink: /posts/:title/

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      visible: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: null

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .idea
  - CLAUDE.md
