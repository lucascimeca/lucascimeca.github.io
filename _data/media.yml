- title: AI scientist Luca Scimeca discusses disruptive discovery and the global impact of AI
  date: 2026-08-18
  kind: Podcast
  outlet: Build Better Business Podcast
  url: https://podcasts.apple.com/us/podcast/ai-scientist-luca-scimeca-phd-discusses-disruptive/id1797650712?i=1000784131546
  image: /assets/img/media/podcast.jpg
  image_fit: contain          # square artwork — showing it whole beats cropping
  summary: >-
    A conversation with host Chuck Crumpton on where AI is genuinely
    transformative and where it is oversold — scaling laws and their plateaus,
    the architectural constraints in the way, and why a disruptive breakthrough
    rather than more compute is the thing that would move the timeline.
