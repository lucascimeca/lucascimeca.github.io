- title: The first robotic lettuce-peeling system of its kind
  date: 2018-09-25
  kind: Press
  outlet: University of Cambridge
  url: https://www.eng.cam.ac.uk/news/introducing-lettuce-peeling-robot
  summary: >-
    Removing the outer leaves from an iceberg lettuce is still done by hand. A
    team at Cambridge's Machine Intelligence Laboratory paired a machine vision
    pipeline with a 3D-printed suction nozzle that tears each leaf away without
    bruising the head, managing full removal in about 27 seconds. Published in
    IEEE Robotics and Automation Letters.
  also:
    - name: University of Cambridge
      url: https://www.eng.cam.ac.uk/news/introducing-lettuce-peeling-robot
